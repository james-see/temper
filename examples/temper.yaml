temper:
  budget:
    max_cost_per_task: 5.00
  preference:
    local_first: false
    default_provider: ollama-cloud  # then local ollama, then other keys

providers:
  ollama-cloud:
    type: ollama
    url: https://ollama.com
    cloud_url: https://ollama.com
    # api_key:  # or env OLLAMA_API_KEY

  ollama:
    type: ollama
    url: http://localhost:11434
    cloud_url: https://ollama.com
    # api_key: env OLLAMA_API_KEY

  local-mlx:
    type: omlx
    url: http://localhost:8000

  anthropic:
    type: anthropic

  openai:
    type: openai

  openrouter:
    type: openrouter

agents:
  cursor:
    type: cursor

  claude:
    type: claude-code

  codex:
    type: codex

  opencode:
    type: opencode

  muse:
    type: muse

  goose:
    type: goose

  hermes:
    type: hermes

  native:
    type: temper

  # Generic exec adapter (VAL-2607): any other agent CLI, no Temper release.
  # {prompt} {session} {model} {workspace} expand when argv renders.
  # aider:
  #   type: exec
  #   command: aider
  #   args: ["--no-auto-commits", "{prompt}"]
  #   resume_args: ["--restore", "{session}"]
  #   inject_args: ["--message", "{prompt}"]
  #   log_file: "~/.aider/history/{session}.jsonl"
  #   capabilities:
  #     tools: true
  #     resume: true

arbiter:
  # Stall-triggered escalation order (VAL-2611). First untried, usable,
  # policy-allowed provider wins; remaining ids follow default discovery
  # order. Empty means default order only.
  escalation: [ollama, anthropic, openai]

  policies:
    - match:
        complexity: low
      prefer:
        agent: opencode
        provider: ollama
      # Hard constraints (VAL-2611): deny wins over allow, and both win
      # over preferences and explicit CLI selections. Empty allow = all
      # except denied. Match is reserved; allow/deny apply globally.
      # allow_providers: [ollama, openai]
      # deny_providers: [gemini]
      # allow_agents: [native]
      # deny_agents: [cursor]

    - match:
        language: go
        task: bugfix
      prefer:
        agent: codex

    - match:
        task: research
      prefer:
        agent: hermes

evaluator:
  test: ""
  compile: ""

reflex:
  mode: auto   # auto | human — ctrl+b a toggles live

  detectors:
    repeated_error:
      threshold: 3

    action_cycle:
      repetitions: 2

    stagnation:
      actions: 6

    token_burn:
      threshold: 20000

    regression:
      enabled: true

    repo_stagnation:
      actions: 4   # identical repo state across N assessments

    test_stagnation:
      threshold: 3   # consecutive failures with identical output

    cost_burn:
      usd: 0   # 0 disables; e.g. 0.50 stalls past fifty cents

    plan_without_exec:
      actions: 3   # think-only assessments before stalling

    edit_oscillation:
      enabled: true   # A-B-A file revert detection

  recovery:
    - after: first_stall
      action: replan
    - after: second_stall
      action: critic
    - after: third_stall
      action: switch_model
    - after: fourth_stall
      action: switch_agent
    - after: fifth_stall
      action: rollback
    - after: sixth_stall
      action: fork
    - after: exhausted
      action: human

  recovery_max_attempts: 10   # total ladder interventions per run
  recovery_backoff_seconds: 0   # 0 disables; N spaces retries 1x, 2x, 4x...

  # Local critic. Default on. Invoked when heuristics return Uncertain.
  # Default weights: Liquid LFM2.5 2.6B Q4_K_M via Ollama (~1.67GB).
  # LFM Open License v1.0 — not OSI; free commercial under $10M revenue.
  # Temper stays Apache-2.0. Weights are not vendored.
  # auto_pull asks local Ollama to fetch the model on first miss.
  # TEMPER_JUDGE=off disables. TEMPER_JUDGE_MODEL overrides the weights.
  judge:
    enabled: true
    model: oamazonasgabriel/lfm2.5-2.6b:q4_k_m-8gbGPU
    endpoint: ""
    auto_pull: true

workspace:
  root: .
  # Task branches default to <branch_prefix><run-id>; override per run with
  # `temper run --branch`. Base resolution: --base flag, then base_branch,
  # then the repo default (origin/HEAD, main/master, HEAD).
  branch_prefix: temper/
  base_branch: ""
