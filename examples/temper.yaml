temper:
  budget:
    max_cost_per_task: 5.00
  preference:
    local_first: false
    default_provider: ollama-cloud  # then local ollama, then other keys

providers:
  ollama-cloud:
    type: ollama
    url: https://ollama.com
    cloud_url: https://ollama.com
    # api_key:  # or env OLLAMA_API_KEY

  ollama:
    type: ollama
    url: http://localhost:11434
    cloud_url: https://ollama.com
    # api_key: env OLLAMA_API_KEY

  local-mlx:
    type: omlx
    url: http://localhost:8000

  anthropic:
    type: anthropic

  openai:
    type: openai

  openrouter:
    type: openrouter

agents:
  cursor:
    type: cursor

  claude:
    type: claude-code

  codex:
    type: codex

  opencode:
    type: opencode

  hermes:
    type: hermes

  native:
    type: temper

arbiter:
  policies:
    - match:
        complexity: low
      prefer:
        agent: opencode
        provider: ollama

    - match:
        language: go
        task: bugfix
      prefer:
        agent: codex

    - match:
        task: research
      prefer:
        agent: hermes

evaluator:
  test: ""
  compile: ""

reflex:
  mode: auto   # auto | human — ctrl+b a toggles live

  detectors:
    repeated_error:
      threshold: 3

    action_cycle:
      repetitions: 2

    stagnation:
      actions: 6

    token_burn:
      threshold: 20000

    regression:
      enabled: true

  recovery:
    - after: first_stall
      action: replan
    - after: second_stall
      action: critic
    - after: third_stall
      action: switch_model
    - after: fourth_stall
      action: switch_agent
    - after: exhausted
      action: human

  # Local critic. Default on. Invoked when heuristics return Uncertain.
  # Default weights: Liquid LFM2.5 2.6B Q4_K_M via Ollama (~1.67GB).
  # LFM Open License v1.0 — not OSI; free commercial under $10M revenue.
  # Temper stays Apache-2.0. Weights are not vendored.
  # auto_pull asks local Ollama to fetch the model on first miss.
  # TEMPER_JUDGE=off disables. TEMPER_JUDGE_MODEL overrides the weights.
  judge:
    enabled: true
    model: oamazonasgabriel/lfm2.5-2.6b:q4_k_m-8gbGPU
    endpoint: ""
    auto_pull: true
