# GoReleaser config for temper.
#
# Tag a release with `git tag vX.Y.Z && git push origin vX.Y.Z`.
# Pushing the tag fires release.yml, which builds the four platform
# tarballs, creates the GitHub release, and bumps the homebrew-tap
# formula. Requires a TAP_TOKEN repository secret: a fine-grained PAT
# with Contents read/write on james-see/homebrew-tap.
version: 2

project_name: temper

before:
  hooks:
    - go mod download

builds:
  - id: temper
    main: ./cmd/temper
    binary: temper
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]

archives:
  - id: temper
    name_template: "temper_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - src: temper
        dst: temper

checksum:
  name_template: checksums.txt

release:
  draft: false

brews:
  - name: temper
    # Flip to false once a TAP_TOKEN secret exists (fine-grained PAT with
    # Contents read/write on james-see/homebrew-tap). Until then the
    # formula bump stays manual.
    skip_upload: true
    repository:
      owner: james-see
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_TOKEN }}"
    directory: Formula
    homepage: https://temper.baby
    description: Adaptive control plane for coding agents
    license: Apache-2.0
    test: |
      system "#{bin}/temper", "version"
